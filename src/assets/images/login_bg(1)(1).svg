<svg xmlns="http://www.w3.org/2000/svg"
     version="1.1"
     baseProfile="full"
     width="100%"
     height="100%"
     viewBox="0 0 1400 800">

    <defs>
        <filter id="lineGlowFilter" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="1.5" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
        <filter id="pointGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
    </defs>

    <!-- 背景微粒（保持不变） -->
    <g>
        <circle cx="100" cy="200" r="3" fill="#8DA4D9" opacity="0.35">
            <animate attributeName="cy" values="200;100;200" dur="12s" repeatCount="indefinite"/>
        </circle>
        <circle cx="300" cy="400" r="3" fill="#8DA4D9" opacity="0.3">
            <animate attributeName="cy" values="400;250;400" dur="15s" repeatCount="indefinite"/>
        </circle>
        <circle cx="600" cy="100" r="3" fill="#8DA4D9" opacity="0.3">
            <animate attributeName="cy" values="100;50;100" dur="18s" repeatCount="indefinite"/>
        </circle>
        <circle cx="900" cy="300" r="3" fill="#8DA4D9" opacity="0.35">
            <animate attributeName="cy" values="300;150;300" dur="14s" repeatCount="indefinite"/>
        </circle>
        <circle cx="1200" cy="150" r="3" fill="#8DA4D9" opacity="0.3">
            <animate attributeName="cy" values="150;50;150" dur="16s" repeatCount="indefinite"/>
        </circle>
    </g>

    <!-- 电路折线（保持不变） -->
    <g stroke="#8DA4D9" stroke-width="2" fill="none" filter="url(#lineGlowFilter)">
        <path d="M 0 150 L 80 150 L 80 100 L 150 100 L 150 180 L 220 180 L 220 120 L 300 120 L 300 200 L 400 200 L 400 150" />
        <path d="M 0 350 L 70 350 L 70 390 L 140 390 L 140 330 L 210 330 L 210 410 L 280 410 L 280 350 L 350 350 L 350 430" />
        <path d="M 0 600 L 90 600 L 90 560 L 180 560 L 180 620 L 270 620 L 270 580 L 360 580 L 360 650 L 450 650 L 450 600" />
        <path d="M 1400 150 L 1320 150 L 1320 100 L 1250 100 L 1250 180 L 1180 180 L 1180 120 L 1100 120 L 1100 200 L 1000 200 L 1000 150" />
        <path d="M 1400 350 L 1330 350 L 1330 390 L 1260 390 L 1260 330 L 1190 330 L 1190 410 L 1120 410 L 1120 350 L 1050 350 L 1050 430" />
        <path d="M 1400 600 L 1310 600 L 1310 560 L 1220 560 L 1220 620 L 1130 620 L 1130 580 L 1040 580 L 1040 650 L 950 650 L 950 600" />
    </g>

    <!-- ✨ 关键修正：所有光点严格同步 ✨ -->
    <!-- 半径: 3(小) → 5(大) → 3(小) → 3(小) -->
    <!-- 颜色: #FFFFFF(浅) → #1C40AF(深) → #FFFFFF(浅) → #FFFFFF(浅) -->
    <!-- 实现：半径增大时颜色变深，半径减小时颜色变浅 -->
    <g>
        <!-- 左侧第一条折线 -->
        <circle cx="80" cy="150" r="3" fill="#FFFFFF" filter="url(#pointGlow)">
            <animate attributeName="fill" values="#FFFFFF;#1C40AF;#FFFFFF;#FFFFFF" dur="2.5s" repeatCount="indefinite" begin="0s"/>
            <animate attributeName="r" values="3;5;3;3" dur="2.5s" repeatCount="indefinite" begin="0s"/>
        </circle>
        <circle cx="150" cy="100" r="3" fill="#FFFFFF" filter="url(#pointGlow)">
            <animate attributeName="fill" values="#FFFFFF;#1C40AF;#FFFFFF;#FFFFFF" dur="2.5s" repeatCount="indefinite" begin="0.3s"/>
            <animate attributeName="r" values="3;5;3;3" dur="2.5s" repeatCount="indefinite" begin="0.3s"/>
        </circle>
        <circle cx="220" cy="180" r="3" fill="#FFFFFF" filter="url(#pointGlow)">
            <animate attributeName="fill" values="#FFFFFF;#1C40AF;#FFFFFF;#FFFFFF" dur="2.5s" repeatCount="indefinite" begin="0.6s"/>
            <animate attributeName="r" values="3;5;3;3" dur="2.5s" repeatCount="indefinite" begin="0.6s"/>
        </circle>
        <circle cx="300" cy="120" r="3" fill="#FFFFFF" filter="url(#pointGlow)">
            <animate attributeName="fill" values="#FFFFFF;#1C40AF;#FFFFFF;#FFFFFF" dur="2.5s" repeatCount="indefinite" begin="0.9s"/>
            <animate attributeName="r" values="3;5;3;3" dur="2.5s" repeatCount="indefinite" begin="0.9s"/>
        </circle>
        <circle cx="400" cy="200" r="3" fill="#FFFFFF" filter="url(#pointGlow)">
            <animate attributeName="fill" values="#FFFFFF;#1C40AF;#FFFFFF;#FFFFFF" dur="2.5s" repeatCount="indefinite" begin="1.2s"/>
            <animate attributeName="r" values="3;5;3;3" dur="2.5s" repeatCount="indefinite" begin="1.2s"/>
        </circle>

        <!-- 左侧第二条折线 -->
        <circle cx="70" cy="350" r="3" fill="#FFFFFF" filter="url(#pointGlow)">
            <animate attributeName="fill" values="#FFFFFF;#1C40AF;#FFFFFF;#FFFFFF" dur="2.5s" repeatCount="indefinite" begin="0.1s"/>
            <animate attributeName="r" values="3;5;3;3" dur="2.5s" repeatCount="indefinite" begin="0.1s"/>
        </circle>
        <circle cx="140" cy="390" r="3" fill="#FFFFFF" filter="url(#pointGlow)">
            <animate attributeName="fill" values="#FFFFFF;#1C40AF;#FFFFFF;#FFFFFF" dur="2.5s" repeatCount="indefinite" begin="0.4s"/>
            <animate attributeName="r" values="3;5;3;3" dur="2.5s" repeatCount="indefinite" begin="0.4s"/>
        </circle>
        <circle cx="210" cy="330" r="3" fill="#FFFFFF" filter="url(#pointGlow)">
            <animate attributeName="fill" values="#FFFFFF;#1C40AF;#FFFFFF;#FFFFFF" dur="2.5s" repeatCount="indefinite" begin="0.7s"/>
            <animate attributeName="r" values="3;5;3;3" dur="2.5s" repeatCount="indefinite" begin="0.7s"/>
        </circle>
        <circle cx="280" cy="410" r="3" fill="#FFFFFF" filter="url(#pointGlow)">
            <animate attributeName="fill" values="#FFFFFF;#1C40AF;#FFFFFF;#FFFFFF" dur="2.5s" repeatCount="indefinite" begin="1.0s"/>
            <animate attributeName="r" values="3;5;3;3" dur="2.5s" repeatCount="indefinite" begin="1.0s"/>
        </circle>
        <circle cx="350" cy="350" r="3" fill="#FFFFFF" filter="url(#pointGlow)">
            <animate attributeName="fill" values="#FFFFFF;#1C40AF;#FFFFFF;#FFFFFF" dur="2.5s" repeatCount="indefinite" begin="1.3s"/>
            <animate attributeName="r" values="3;5;3;3" dur="2.5s" repeatCount="indefinite" begin="1.3s"/>
        </circle>

        <!-- 左侧第三条折线 -->
        <circle cx="90" cy="600" r="3" fill="#FFFFFF" filter="url(#pointGlow)">
            <animate attributeName="fill" values="#FFFFFF;#1C40AF;#FFFFFF;#FFFFFF" dur="2.5s" repeatCount="indefinite" begin="0.2s"/>
            <animate attributeName="r" values="3;5;3;3" dur="2.5s" repeatCount="indefinite" begin="0.2s"/>
        </circle>
        <circle cx="180" cy="560" r="3" fill="#FFFFFF" filter="url(#pointGlow)">
            <animate attributeName="fill" values="#FFFFFF;#1C40AF;#FFFFFF;#FFFFFF" dur="2.5s" repeatCount="indefinite" begin="0.5s"/>
            <animate attributeName="r" values="3;5;3;3" dur="2.5s" repeatCount="indefinite" begin="0.5s"/>
        </circle>
        <circle cx="270" cy="620" r="3" fill="#FFFFFF" filter="url(#pointGlow)">
            <animate attributeName="fill" values="#FFFFFF;#1C40AF;#FFFFFF;#FFFFFF" dur="2.5s" repeatCount="indefinite" begin="0.8s"/>
            <animate attributeName="r" values="3;5;3;3" dur="2.5s" repeatCount="indefinite" begin="0.8s"/>
        </circle>
        <circle cx="360" cy="580" r="3" fill="#FFFFFF" filter="url(#pointGlow)">
            <animate attributeName="fill" values="#FFFFFF;#1C40AF;#FFFFFF;#FFFFFF" dur="2.5s" repeatCount="indefinite" begin="1.1s"/>
            <animate attributeName="r" values="3;5;3;3" dur="2.5s" repeatCount="indefinite" begin="1.1s"/>
        </circle>
        <circle cx="450" cy="650" r="3" fill="#FFFFFF" filter="url(#pointGlow)">
            <animate attributeName="fill" values="#FFFFFF;#1C40AF;#FFFFFF;#FFFFFF" dur="2.5s" repeatCount="indefinite" begin="1.4s"/>
            <animate attributeName="r" values="3;5;3;3" dur="2.5s" repeatCount="indefinite" begin="1.4s"/>
        </circle>

        <!-- 右侧折线（全部同步修正） -->
        <circle cx="1320" cy="150" r="3" fill="#FFFFFF" filter="url(#pointGlow)">
            <animate attributeName="fill" values="#FFFFFF;#1C40AF;#FFFFFF;#FFFFFF" dur="2.5s" repeatCount="indefinite" begin="0.25s"/>
            <animate attributeName="r" values="3;5;3;3" dur="2.5s" repeatCount="indefinite" begin="0.25s"/>
        </circle>
        <circle cx="1250" cy="100" r="3" fill="#FFFFFF" filter="url(#pointGlow)">
            <animate attributeName="fill" values="#FFFFFF;#1C40AF;#FFFFFF;#FFFFFF" dur="2.5s" repeatCount="indefinite" begin="0.55s"/>
            <animate attributeName="r" values="3;5;3;3" dur="2.5s" repeatCount="indefinite" begin="0.55s"/>
        </circle>
        <circle cx="1180" cy="180" r="3" fill="#FFFFFF" filter="url(#pointGlow)">
            <animate attributeName="fill" values="#FFFFFF;#1C40AF;#FFFFFF;#FFFFFF" dur="2.5s" repeatCount="indefinite" begin="0.85s"/>
            <animate attributeName="r" values="3;5;3;3" dur="2.5s" repeatCount="indefinite" begin="0.85s"/>
        </circle>
        <circle cx="1100" cy="120" r="3" fill="#FFFFFF" filter="url(#pointGlow)">
            <animate attributeName="fill" values="#FFFFFF;#1C40AF;#FFFFFF;#FFFFFF" dur="2.5s" repeatCount="indefinite" begin="1.15s"/>
            <animate attributeName="r" values="3;5;3;3" dur="2.5s" repeatCount="indefinite" begin="1.15s"/>
        </circle>
        <circle cx="1000" cy="200" r="3" fill="#FFFFFF" filter="url(#pointGlow)">
            <animate attributeName="fill" values="#FFFFFF;#1C40AF;#FFFFFF;#FFFFFF" dur="2.5s" repeatCount="indefinite" begin="1.45s"/>
            <animate attributeName="r" values="3;5;3;3" dur="2.5s" repeatCount="indefinite" begin="1.45s"/>
        </circle>
        <circle cx="1330" cy="350" r="3" fill="#FFFFFF" filter="url(#pointGlow)">
            <animate attributeName="fill" values="#FFFFFF;#1C40AF;#FFFFFF;#FFFFFF" dur="2.5s" repeatCount="indefinite" begin="0.35s"/>
            <animate attributeName="r" values="3;5;3;3" dur="2.5s" repeatCount="indefinite" begin="0.35s"/>
        </circle>
        <circle cx="1260" cy="390" r="3" fill="#FFFFFF" filter="url(#pointGlow)">
            <animate attributeName="fill" values="#FFFFFF;#1C40AF;#FFFFFF;#FFFFFF" dur="2.5s" repeatCount="indefinite" begin="0.65s"/>
            <animate attributeName="r" values="3;5;3;3" dur="2.5s" repeatCount="indefinite" begin="0.65s"/>
        </circle>
        <circle cx="1190" cy="330" r="3" fill="#FFFFFF" filter="url(#pointGlow)">
            <animate attributeName="fill" values="#FFFFFF;#1C40AF;#FFFFFF;#FFFFFF" dur="2.5s" repeatCount="indefinite" begin="0.95s"/>
            <animate attributeName="r" values="3;5;3;3" dur="2.5s" repeatCount="indefinite" begin="0.95s"/>
        </circle>
        <circle cx="1120" cy="410" r="3" fill="#FFFFFF" filter="url(#pointGlow)">
            <animate attributeName="fill" values="#FFFFFF;#1C40AF;#FFFFFF;#FFFFFF" dur="2.5s" repeatCount="indefinite" begin="1.25s"/>
            <animate attributeName="r" values="3;5;3;3" dur="2.5s" repeatCount="indefinite" begin="1.25s"/>
        </circle>
        <circle cx="1050" cy="350" r="3" fill="#FFFFFF" filter="url(#pointGlow)">
            <animate attributeName="fill" values="#FFFFFF;#1C40AF;#FFFFFF;#FFFFFF" dur="2.5s" repeatCount="indefinite" begin="1.55s"/>
            <animate attributeName="r" values="3;5;3;3" dur="2.5s" repeatCount="indefinite" begin="1.55s"/>
        </circle>
        <circle cx="1310" cy="600" r="3" fill="#FFFFFF" filter="url(#pointGlow)">
            <animate attributeName="fill" values="#FFFFFF;#1C40AF;#FFFFFF;#FFFFFF" dur="2.5s" repeatCount="indefinite" begin="0.45s"/>
            <animate attributeName="r" values="3;5;3;3" dur="2.5s" repeatCount="indefinite" begin="0.45s"/>
        </circle>
        <circle cx="1220" cy="560" r="3" fill="#FFFFFF" filter="url(#pointGlow)">
            <animate attributeName="fill" values="#FFFFFF;#1C40AF;#FFFFFF;#FFFFFF" dur="2.5s" repeatCount="indefinite" begin="0.75s"/>
            <animate attributeName="r" values="3;5;3;3" dur="2.5s" repeatCount="indefinite" begin="0.75s"/>
        </circle>
        <circle cx="1130" cy="620" r="3" fill="#FFFFFF" filter="url(#pointGlow)">
            <animate attributeName="fill" values="#FFFFFF;#1C40AF;#FFFFFF;#FFFFFF" dur="2.5s" repeatCount="indefinite" begin="1.05s"/>
            <animate attributeName="r" values="3;5;3;3" dur="2.5s" repeatCount="indefinite" begin="1.05s"/>
        </circle>
        <circle cx="1040" cy="580" r="3" fill="#FFFFFF" filter="url(#pointGlow)">
            <animate attributeName="fill" values="#FFFFFF;#1C40AF;#FFFFFF;#FFFFFF" dur="2.5s" repeatCount="indefinite" begin="1.35s"/>
            <animate attributeName="r" values="3;5;3;3" dur="2.5s" repeatCount="indefinite" begin="1.35s"/>
        </circle>
        <circle cx="950" cy="650" r="3" fill="#FFFFFF" filter="url(#pointGlow)">
            <animate attributeName="fill" values="#FFFFFF;#1C40AF;#FFFFFF;#FFFFFF" dur="2.5s" repeatCount="indefinite" begin="1.65s"/>
            <animate attributeName="r" values="3;5;3;3" dur="2.5s" repeatCount="indefinite" begin="1.65s"/>
        </circle>
    </g>

    <!-- 扫描线（保持不变） -->
    <rect x="0" y="0" width="1400" height="2" fill="#8DA4D9" opacity="0.15" filter="url(#lineGlowFilter)">
        <animate attributeName="y" values="0;800;0" dur="12s" repeatCount="indefinite"/>
    </rect>

    <!-- 齿轮（保持不变） -->
    <g transform="translate(40,560) scale(3.5)">
        <g>
            <animateTransform attributeName="transform" type="rotate" from="0 30 30" to="360 30 30" dur="10s" repeatCount="indefinite"/>
            <path d="m45.6381035 30c0-2.5011482 1.4106255-4.5648193 3.2598457-4.9725227-.4546356-1.7314034-1.1349182-3.3668499-2.0171814-4.8756714-1.5958252 1.0209045-4.0536957.5597-5.8230019-1.2096081-1.76931-1.7693081-2.2304382-4.2271032-1.2095375-5.8229284-1.5088196-.882266-3.1442642-1.5625448-4.8756676-2.0171843-.4077072 1.8492222-2.4713783 3.2598486-4.9725246 3.2598486s-4.5648174-1.4106264-4.9725227-3.2598486c-1.7314014.4546394-3.366848 1.1349182-4.8756695 2.0171843 1.0209045 1.5958252.5597744 4.0536203-1.2095337 5.8229284s-4.2271786 2.2305126-5.8230028 1.2096081c-.882267 1.5088215-1.5625458 3.144268-2.0171843 4.8756714 1.8492222.4077034 3.2598486 2.4713745 3.2598486 4.9725227 0 2.5012207-1.4106264 4.564743-3.2599239 4.9724464.4546394 1.7314034 1.1349926 3.366848 2.0172596 4.8757439 1.5958242-1.0209007 4.0536947-.5597725 5.8230028 1.2095375 1.7693081 1.7693062 2.2304382 4.2271767 1.2095337 5.8230019 1.5088215.882267 3.144268 1.5625458 4.8756695 2.0171852.4077053-1.8492241 2.4713764-3.2599258 4.9725227-3.2599258s4.5648174 1.4107018 4.9725246 3.2599258c1.7314034-.4546394 3.366848-1.1349182 4.8756676-2.0171852-1.0209007-1.5958252-.5597725-4.0536957 1.2095375-5.8230019 1.7693062-1.76931 4.2271767-2.2304382 5.8230019-1.2095375.8822632-1.5088959 1.5626183-3.1443405 2.0172577-4.8757439-1.8492966-.4077033-3.259922-2.4712257-3.259922-4.9724464z" fill="#B0C4E0">
