<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 半透明白色背景 -->
  <rect width="800" height="600" fill="rgba(255, 255, 255, 0.9)" />
  
  <!-- 工业背景元素 -->
  <g opacity="0.3">
    <!-- 网格背景 -->
    <pattern id="smallGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e40af" stroke-width="0.5"/>
    </pattern>
    <pattern id="largeGrid" width="200" height="200" patternUnits="userSpaceOnUse">
      <rect width="200" height="200" fill="url(#smallGrid)"/>
      <path d="M 200 0 L 0 0 0 200" fill="none" stroke="#1e40af" stroke-width="1"/>
    </pattern>
    <rect width="800" height="600" fill="url(#largeGrid)" />
    
    <!-- 科技圆环 -->
    <g transform="translate(400, 300)">
      <circle cx="0" cy="0" r="150" fill="none" stroke="#1e40af" stroke-width="0.5" opacity="0.2" stroke-dasharray="5,10"/>
      <circle cx="0" cy="0" r="120" fill="none" stroke="#1e40af" stroke-width="0.8" opacity="0.3" stroke-dasharray="20,10"/>
      <circle cx="0" cy="0" r="90" fill="none" stroke="#1e40af" stroke-width="1" opacity="0.4"/>
      <circle cx="0" cy="0" r="60" fill="none" stroke="#1e40af" stroke-width="0.5" opacity="0.3" stroke-dasharray="10,5"/>
    </g>
    
    <!-- 齿轮装饰 -->
    <g transform="translate(150, 150) scale(0.6)">
      <path d="M0,-50 L10,-45 L10,-30 L25,-30 L30,-20 L45,-20 L50,0 L45,20 L30,20 L25,30 L10,30 L10,45 L0,50 L-10,45 L-10,30 L-25,30 L-30,20 L-45,20 L-50,0 L-45,-20 L-30,-20 L-25,-30 L-10,-30 L-10,-45 Z" fill="#e2e8f0" stroke="#1e40af" stroke-width="1" opacity="0.6"/>
      <circle cx="0" cy="0" r="20" fill="#ffffff" stroke="#1e40af" stroke-width="1" opacity="0.8"/>
      <circle cx="0" cy="0" r="8" fill="#1e40af" opacity="0.4"/>
    </g>
    
    <g transform="translate(650, 450) scale(0.4)">
      <path d="M0,-50 L10,-45 L10,-30 L25,-30 L30,-20 L45,-20 L50,0 L45,20 L30,20 L25,30 L10,30 L10,45 L0,50 L-10,45 L-10,30 L-25,30 L-30,20 L-45,20 L-50,0 L-45,-20 L-30,-20 L-25,-30 L-10,-30 L-10,-45 Z" fill="#e2e8f0" stroke="#1e40af" stroke-width="1" opacity="0.5"/>
      <circle cx="0" cy="0" r="20" fill="#ffffff" stroke="#1e40af" stroke-width="1" opacity="0.8"/>
      <circle cx="0" cy="0" r="8" fill="#1e40af" opacity="0.4"/>
    </g>
  </g>
  
  <!-- 工业科技元素 -->
  
  <!-- 中央显示屏幕 -->
  <g transform="translate(400, 300)">
    <rect x="-180" y="-120" width="360" height="240" rx="8" fill="#f8fafc" stroke="#1e40af" stroke-width="2" opacity="0.9"/>
    
    <!-- 屏幕内容 -->
    <g transform="translate(-160, -100)">
      <!-- 数据图表 -->
      <g>
        <rect x="0" y="0" width="120" height="80" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <circle cx="30" cy="30" r="20" fill="none" stroke="#1e40af" stroke-width="2"/>
        <path d="M30,10 A20,20 0 1,1 30,50" fill="none" stroke="#22c55e" stroke-width="2" stroke-dasharray="126" stroke-dashoffset="30"/>
        <rect x="60" y="20" width="40" height="10" fill="#1e40af" opacity="0.8"/>
        <rect x="60" y="35" width="35" height="10" fill="#1e40af" opacity="0.6"/>
        <rect x="60" y="50" width="30" height="10" fill="#1e40af" opacity="0.4"/>
      </g>
      
      <!-- 控制面板 -->
      <g transform="translate(150, 0)">
        <rect x="0" y="0" width="120" height="80" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <circle cx="60" cy="30" r="25" fill="none" stroke="#1e40af" stroke-width="2"/>
        <circle cx="60" cy="30" r="3" fill="#1e40af"/>
        <line x1="60" y1="3" x2="60" y2="15" stroke="#1e40af" stroke-width="2" stroke-linecap="round"/>
        <rect x="30" y="60" width="60" height="10" rx="5" fill="#e2e8f0"/>
        <rect x="35" y="62" width="50" height="6" rx="3" fill="#1e40af"/>
      </g>
      
      <!-- 状态指示灯 -->
      <g transform="translate(0, 100)">
        <circle cx="20" cy="10" r="6" fill="#22c55e"/>
        <circle cx="50" cy="10" r="6" fill="#f59e0b"/>
        <circle cx="80" cy="10" r="6" fill="#1e40af"/>
        <text x="110" y="15" font-family="Arial" font-size="12" fill="#1e40af">系统正常运行中</text>
      </g>
    </g>
  </g>
  
  <!-- 工业设备元素 -->
  
  <!-- 左侧设备 -->
  <g transform="translate(100, 450)">
    <rect x="-40" y="-30" width="80" height="60" rx="4" fill="#f8fafc" stroke="#1e40af" stroke-width="1"/>
    <circle cx="0" cy="0" r="20" fill="#e2e8f0"/>
    <circle cx="0" cy="0" r="10" fill="#1e40af" opacity="0.6"/>
    <rect x="-25" y="-5" width="50" height="10" fill="#e2e8f0"/>
  </g>
  
  <!-- 右侧设备 -->
  <g transform="translate(700, 450)">
    <rect x="-40" y="-30" width="80" height="60" rx="4" fill="#f8fafc" stroke="#1e40af" stroke-width="1"/>
    <rect x="-30" y="-20" width="60" height="40" rx="2" fill="#e2e8f0"/>
    <rect x="-25" y="-15" width="50" height="8" fill="#1e40af" opacity="0.7"/>
    <rect x="-25" y="-5" width="50" height="8" fill="#1e40af" opacity="0.5"/>
    <rect x="-25" y="5" width="50" height="8" fill="#1e40af" opacity="0.3"/>
  </g>
  
  <!-- 顶部科技装饰 -->
  <g transform="translate(400, 100)">
    <path d="M-150,0 L-120,20 L-90,0 L-60,20 L-30,0 L0,20 L30,0 L60,20 L90,0 L120,20 L150,0" fill="none" stroke="#1e40af" stroke-width="1"/>
    <circle cx="-120" cy="20" r="3" fill="#1e40af"/>
    <circle cx="-60" cy="20" r="3" fill="#1e40af"/>
    <circle cx="0" cy="20" r="3" fill="#1e40af"/>
    <circle cx="60" cy="20" r="3" fill="#1e40af"/>
    <circle cx="120" cy="20" r="3" fill="#1e40af"/>
  </g>
  
  <!-- 底部科技装饰 -->
  <g transform="translate(400, 500)">
    <path d="M-150,0 L-120,-20 L-90,0 L-60,-20 L-30,0 L0,-20 L30,0 L60,-20 L90,0 L120,-20 L150,0" fill="none" stroke="#1e40af" stroke-width="1"/>
    <circle cx="-120" cy="-20" r="3" fill="#1e40af"/>
    <circle cx="-60" cy="-20" r="3" fill="#1e40af"/>
    <circle cx="0" cy="-20" r="3" fill="#1e40af"/>
    <circle cx="60" cy="-20" r="3" fill="#1e40af"/>
    <circle cx="120" cy="-20" r="3" fill="#1e40af"/>
  </g>
  
  <!-- 工业科技标题 -->
  <g transform="translate(400, 60)">
    <text x="0" y="0" font-family="Arial" font-size="24" font-weight="bold" fill="#1e40af" text-anchor="middle">智能制造系统</text>
    <text x="0" y="30" font-family="Arial" font-size="14" fill="#64748b" text-anchor="middle">Industry 4.0 数字化解决方案</text>
  </g>
</svg>